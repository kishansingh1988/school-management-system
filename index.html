<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Apex Horizon Public School - School Management System (Playgroup to Class 10th)</title>
    
    <!-- PWA Web App Manifest & Mobile Meta -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Apex School ERP">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- jsPDF & AutoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 font-sans text-slate-900 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Root Application Mount Point -->
    <div id="app"></div>

    <!-- Application JavaScript Modules -->
    <script src="js/utils/seedData.js"></script>
    <script src="js/utils/formatters.js"></script>
    <script src="js/utils/pdfGenerator.js"></script>
    <script src="js/store.js"></script>
    <script src="js/components/AuthModal.js"></script>
    <script src="js/components/AdminDashboard.js"></script>
    <script src="js/components/TeacherDashboard.js"></script>
    <script src="js/components/StudentDashboard.js"></script>
    <script src="js/components/ParentDashboard.js"></script>
    <script src="js/components/StudentDirectory.js"></script>
    <script src="js/components/TeacherDirectory.js"></script>
    <script src="js/components/AttendanceModule.js"></script>
    <script src="js/components/GradebookModule.js"></script>
    <script src="js/components/TimetableModule.js"></script>
    <script src="js/components/FeeModule.js"></script>
    <script src="js/components/HomeworkModule.js"></script>
    <script src="js/components/NoticeModule.js"></script>
    <script src="js/components/SettingsModule.js"></script>
    <script src="js/components/SuperAdminModule.js"></script>
    <script src="js/components/TransportModule.js"></script>
    <script src="js/components/LibraryModule.js"></script>
    <script src="js/components/PayrollLeavesModule.js"></script>
    <script src="js/app.js"></script>

    <!-- PWA Service Worker Registration & 1-Tap Install Prompt -->
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => {
                        console.log('[PWA] Service Worker registered successfully! Scope:', reg.scope);
                    })
                    .catch(err => {
                        console.log('[PWA] Service Worker registration failed:', err);
                    });
            });
        }

        // Handle PWA Install Prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            // Show custom install floating pill
            const installBtn = document.getElementById('pwaInstallBtn');
            if (installBtn) {
                installBtn.classList.remove('hidden');
            }
        });

        window.installPwaApp = function() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('[PWA] User accepted the install prompt');
                        const installBtn = document.getElementById('pwaInstallBtn');
                        if (installBtn) installBtn.classList.add('hidden');
                    }
                    deferredPrompt = null;
                });
            } else {
                // If on iOS or prompt not ready, show helpful guidance toast
                if (window.app) {
                    window.app.showToast("To install on iPhone/iPad: Tap the Share icon (⬆️) and select 'Add to Home Screen'!", "info");
                }
            }
        };

        window.addEventListener('appinstalled', () => {
            console.log('[PWA] App successfully installed on device!');
            const installBtn = document.getElementById('pwaInstallBtn');
            if (installBtn) installBtn.classList.add('hidden');
            if (window.app) {
                window.app.showToast("🎉 Apex School App installed on your device!", "success");
            }
        });
    </script>

    <!-- Floating PWA Install Pill -->
    <div id="pwaInstallBtn" class="fixed bottom-20 md:bottom-5 right-4 z-40 hidden animate-bounce">
        <button onclick="window.installPwaApp()" class="px-4 py-2.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold text-xs rounded-2xl shadow-2xl flex items-center space-x-2 border-2 border-white/30 backdrop-blur-md">
            <span class="text-base">📱</span>
            <span>Install School App</span>
        </button>
    </div>
</body>
</html>
