<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="115" fill="url(#grad1)"/>

  <!-- Inner Subtle Border -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>

  <!-- Academic Shield Emblem -->
  <path d="M 256 80 L 390 135 C 390 280 256 360 256 360 C 256 360 122 280 122 135 Z" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="4" filter="url(#shadow)"/>

  <!-- Mortarboard Cap (Graduation Icon) -->
  <path d="M 256 140 L 380 200 L 256 260 L 132 200 Z" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <path d="M 190 230 L 190 290 C 190 320 322 320 322 290 L 322 230 L 256 260 Z" fill="#d97706"/>
  
  <!-- Tassel -->
  <path d="M 350 215 L 350 280 L 340 290 L 360 290 Z" fill="#fbbf24"/>

  <!-- Brand Typography -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">APEX ERP</text>
  <text x="256" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#cbd5e1" text-anchor="middle" letter-spacing="4">SCHOOL APP</text>
</svg>
